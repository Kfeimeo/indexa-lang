[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "indexa"
version = "0.1.0"
description = "Compiler for the A indexed tensor-algebra language (spec v0.1) targeting PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
torch = ["torch"]
test = ["pytest", "torch"]

[project.scripts]
indexa = "indexa.cli:main"

[tool.setuptools.packages.find]
include = ["indexa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
